# GitHub Actions Workflow — Ohio Rate Scraper
#
# What this does:
#   Runs your scraper automatically every Monday at 8am Ohio time.
#   Commits the fresh rates_clean.json back to your repo.
#   Vercel sees the new commit and auto-redeploys your app.
#
# Cost: FREE (GitHub Actions free tier = 2,000 minutes/month. This uses ~5 min/week)

name: Scrape Ohio Electricity Rates

on:
  # Run every Monday at 1pm UTC = 8am Ohio time (EST) / 9am (EDT)
  schedule:
    - cron: "0 13 * * 1"

  # Lets you trigger it manually from GitHub's Actions tab
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape PUCO Rates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Check out your code
      - name: Checkout repo
        uses: actions/checkout@v5

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "scraper/package.json"

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: ./scraper
        run: npm install

      # Step 4: Install Playwright's Chromium browser
      # Using "node node_modules/.bin/playwright" instead of "npx playwright"
      # avoids the "Permission denied" error some Actions runners throw with npx
      - name: Install Chromium
        working-directory: ./scraper
        run: node node_modules/.bin/playwright install chromium --with-deps

      # Step 5: Run the scraper
      - name: Run scraper
        working-directory: ./scraper
        run: node scraper.js

      # Step 6: Copy fresh rates.json to project root
      # (matches your actual project — rates_clean.json sits at repo root, not in public/)
      - name: Copy rates to app
        run: cp scraper/data/rates.json rates_clean.json

      # Step 7: Commit and push the fresh data back to GitHub
      # Vercel watches your repo — a new commit triggers an auto-redeploy
      - name: Commit fresh rates
        run: |
          git config user.name  "Rate Scraper Bot"
          git config user.email "bot@ohio-bill-optimizer.com"
          git add rates_clean.json
          git diff --staged --quiet || git commit -m "chore: update Ohio electricity rates $(date +'%Y-%m-%d')"
          git push

      # Step 8: Notify you if the scrape failed
      - name: Alert on failure
        if: failure()
        run: |
          echo "SCRAPE FAILED — Check energychoice.ohio.gov manually"
          echo "Rates were NOT updated this week"
